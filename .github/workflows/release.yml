name: Build RankApi Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: mvn -B clean package

      - name: Prepare release jar name
        run: cp target/Rankapi-*.jar target/RankApi.jar

      - name: Publish release jar
        uses: softprops/action-gh-release@v2
        with:
          files: target/RankApi.jar
